# Paperless Module Menu Definitions
# This file defines the menu structure for the Paperless (Document Management) module
# Used by admin service for dynamic menu registration

module:
  id: paperless
  name: Paperless
  description: Document Management with RustFS Storage

menus:
  - id: paperless
    parent_id: null
    type: CATALOG
    name: Document Management
    path: /paperless
    icon: lucide:file-text
    order: 500
    authority:
      - platform:admin
      - tenant:manager

  - id: paperless-documents
    parent_id: paperless
    type: MENU
    name: Documents
    path: documents
    component: app/paperless/document/index.vue
    icon: lucide:files
    order: 1
    authority:
      - platform:admin
      - tenant:manager

  - id: paperless-signing-templates
    parent_id: paperless
    type: MENU
    name: Signing Templates
    path: signing/templates
    component: app/paperless/signing/templates/index.vue
    icon: lucide:file-signature
    order: 3
    authority:
      - platform:admin
      - tenant:manager

  - id: paperless-signing-requests
    parent_id: paperless
    type: MENU
    name: Signing Requests
    path: signing/requests
    component: app/paperless/signing/requests/index.vue
    icon: lucide:pen-tool
    order: 4
    authority:
      - platform:admin
      - tenant:manager


dashboard_widgets:
  - id: paperless.documents_total
    name: Total Documents
    description: Active and total document counts
    icon: lucide:files
    widget_type: stat_card
    data_source:
      endpoint: /admin/v1/modules/paperless/v1/statistics
      method: GET
    data_mapping:
      value_path: documents.byStatus.DOCUMENT_STATUS_ACTIVE
      total_path: documents.totalCount
      label: Documents
    default_size:
      width: 3
      height: 1
    tags: [paperless, overview]
    authority: [platform:admin, tenant:manager]

  - id: paperless.document_status_bar
    name: Document Status
    description: Bar chart of document statuses
    icon: lucide:bar-chart-3
    widget_type: bar_chart
    data_source:
      endpoint: /admin/v1/modules/paperless/v1/statistics
      method: GET
    data_mapping:
      data_path: documents.byStatus
      label: Document Status
    default_size:
      width: 4
      height: 2
    tags: [paperless, chart]
    authority: [platform:admin, tenant:manager]

  - id: paperless.by_source_pie
    name: Documents by Source
    description: Pie chart of documents grouped by source
    icon: lucide:upload
    widget_type: pie_chart
    data_source:
      endpoint: /admin/v1/modules/paperless/v1/statistics
      method: GET
    data_mapping:
      data_path: documents.bySource
      label: Document Source
    default_size:
      width: 4
      height: 2
    tags: [paperless, chart]
    authority: [platform:admin, tenant:manager]

  - id: paperless.storage_stat
    name: Storage Used
    description: Total document storage in bytes
    icon: lucide:hard-drive
    widget_type: stat_card
    data_source:
      endpoint: /admin/v1/modules/paperless/v1/statistics
      method: GET
    data_mapping:
      value_path: documents.totalStorageBytes
      label: Storage (bytes)
    default_size:
      width: 3
      height: 1
    tags: [paperless, overview]
    authority: [platform:admin, tenant:manager]

  - id: paperless.recent_uploads
    name: Recent Uploads
    description: Documents uploaded in last 24h and 7d
    icon: lucide:upload-cloud
    widget_type: stat_card
    data_source:
      endpoint: /admin/v1/modules/paperless/v1/statistics
      method: GET
    data_mapping:
      value_path: documents.recentUploads24h
      total_path: documents.recentUploads7d
      label: Recent Uploads (24h)
    default_size:
      width: 3
      height: 1
    tags: [paperless, overview]
    authority: [platform:admin, tenant:manager]

permission_groups:
  - name: Paperless
    module: paperless
    description: Paperless Document Management Permissions
    permissions:
      - name: View Documents
        code: paperless.document.view
        description: View document details and list
      - name: Upload Documents
        code: paperless.document.upload
        description: Upload new documents
      - name: Update Documents
        code: paperless.document.update
        description: Update document metadata
      - name: Delete Documents
        code: paperless.document.delete
        description: Delete documents
      - name: View Signing Templates
        code: paperless.signing.template.view
        description: View signing templates
      - name: Manage Signing Templates
        code: paperless.signing.template.manage
        description: Create, update, and delete signing templates
      - name: View Signing Requests
        code: paperless.signing.request.view
        description: View signing requests and their status
      - name: Create Signing Requests
        code: paperless.signing.request.create
        description: Create new signing requests

roles:
  - name: Paperless Administrator
    code: paperless.admin
    description: Full access to Paperless module
    is_system: true
    permissions:
      - paperless.document.view
      - paperless.document.upload
      - paperless.document.update
      - paperless.document.delete
      - paperless.category.manage
      - paperless.signing.template.view
      - paperless.signing.template.manage
      - paperless.signing.request.view
      - paperless.signing.request.create

  - name: Paperless Operator
    code: paperless.operator
    description: Can upload and manage documents
    is_system: true
    permissions:
      - paperless.document.view
      - paperless.document.upload
      - paperless.document.update
      - paperless.category.manage
      - paperless.signing.template.view
      - paperless.signing.request.view
      - paperless.signing.request.create

  - name: Paperless Viewer
    code: paperless.viewer
    description: Read-only access to Paperless module
    is_system: true
    permissions:
      - paperless.document.view
      - paperless.signing.template.view
      - paperless.signing.request.view
