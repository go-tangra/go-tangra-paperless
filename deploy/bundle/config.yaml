# paperless configuration, rendered by the gateway's add-module wizard: every
# ${...} below was filled from the core's own configuration or generated for
# this bundle, so the issuer, trust domain and addresses match the core.
service_name: paperless
trust_domain: ${TRUST_DOMAIN}
env: production
identity:
  provider: provided
enroll:
  enabled: true
  enroll_url: ${LCM_ENROLL_URL}
  lcm_grpc: ${LCM_GRPC}
  tenant_id: ${MESH_TENANT_ID}
  token_file: /tokens/enrollment.token
  state_file: /state/svid.json
authz: { source: file, path: /app/policy.yaml }
server: { grpc_addr: 0.0.0.0:9955, http_addr: 0.0.0.0:9956 }
admin: { addr: 127.0.0.1:9790 }
discovery:
  static:
    gateway: ["${GATEWAY_GRPC}"]
    auth: ["${AUTH_GRPC}"]
    lcm: ["${LCM_GRPC}"]
limits: { max_request_bytes: 67158016 }
limits_paperless: { backup_max_bytes: 33554432, search_max_len: 1024 }
db:
  dsn: postgres://paperless_app:${GEN_PASSWORD_2}@paperless-db:5432/paperless?sslmode=verify-full&sslrootcert=/tls/ca.pem
  migrate_dsn: postgres://postgres:${GEN_PASSWORD_1}@paperless-db:5432/paperless?sslmode=verify-full&sslrootcert=/tls/ca.pem
  max_conns: 16
# The event bus behind GET /api/paperless/v1/stream (live processing status);
# paperless serves that stream itself, so a local Valkey is enough.
valkey:
  addresses: ["paperless-valkey:6379"]
  username: paperless
  password: ${GEN_PASSWORD_3}
  ca_file: /tls/ca.pem
kek: { source: env, env: PAPERLESS_KEK }
# RustFS, Tika and Gotenberg are sidecars on the bundle's private network
# (no published ports), reached over plain HTTP as in the platform stack.
object_store:
  endpoint: paperless-rustfs:9000
  bucket: paperless
  region: us-east-1
  use_ssl: false
  access_key: paperless
  secret_key: ${GEN_PASSWORD_4}
  presign_ttl_seconds: 900
extract:
  tika_url: http://paperless-tika:9998
  gotenberg_url: http://paperless-gotenberg:3000
  timeout_seconds: 120
  max_bytes: 67108864
uploads: { max_size_bytes: 67108864, allowed_mime: [] }
jobs: { workers: 4, interval_seconds: 5, lease_seconds: 300, max_retries: 3, retry_delay_seconds: 30, backoff_multiplier: 2.0, job_timeout_seconds: 300, cleanup_days: 30 }
events: { enabled: true }
gateway: { service: gateway, issuer: ${GATEWAY_ISSUER} }
