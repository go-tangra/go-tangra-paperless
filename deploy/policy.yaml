# Freya service-to-service policy for paperless: the gateway forwards browser
# traffic and probes health; the paperless.v1 gRPC surface (document/category/
# permission/statistics) is called by other modules directly. Paperless itself
# calls lcm/auth as a client, and reaches MinIO/Tika/Gotenberg over plain HTTP
# (those are infra sidecars, not mesh peers). The asset module stores, reads,
# deletes and searches its attachments here (asset-documents) with the
# sdk/pkg/paperlessclient SDK.
version: paperless-dev-1
rules:
  - id: gateway-forwards
    from: ["spiffe://example.org/svc/gateway"]
    to: ["paperless"]
    operations: ["*"]
    effect: allow
  - id: asset-documents
    # asset keeps asset attachments as paperless documents under
    # /Assets/<asset tag> (resolve-or-create the folders, then store/read/
    # delete/search the documents it owns). Nothing else: no Update/Move/
    # BatchDelete, no category mutation beyond Create, no permissions/stats.
    from: ["spiffe://example.org/svc/asset"]
    to: ["paperless"]
    operations: ["/paperless.v1.PaperlessDocumentService/Create",
                 "/paperless.v1.PaperlessDocumentService/Get",
                 "/paperless.v1.PaperlessDocumentService/Download",
                 "/paperless.v1.PaperlessDocumentService/Delete",
                 "/paperless.v1.PaperlessDocumentService/Search",
                 "/paperless.v1.PaperlessDocumentService/List",
                 "/paperless.v1.PaperlessCategoryService/Create",
                 "/paperless.v1.PaperlessCategoryService/Get",
                 "/paperless.v1.PaperlessCategoryService/List",
                 "/paperless.v1.PaperlessCategoryService/GetTree"]
    effect: allow
